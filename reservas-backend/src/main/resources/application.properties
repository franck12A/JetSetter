# Puerto de la app
server.port=${PORT:8080}

# PostgreSQL - Render debe proporcionar DATABASE_URL con el prefijo jdbc:postgresql://...
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Para que Spring sirva cualquier archivo dentro de static/images
spring.mvc.static-path-pattern=/images/**
spring.web.resources.static-locations=classpath:/static/images/

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=false

# Provider
app.provider.whatsapp=${APP_PROVIDER_WHATSAPP:+54 11 5555-0101}
app.provider.email=${APP_PROVIDER_EMAIL:soporte@jetsetter.com}

# FlightAPI.io. The key is intentionally read only from the environment.
flight.api.key=${FLIGHT_API_KEY:}
flight.api.base-url=${FLIGHT_API_BASE_URL:https://api.flightapi.io}

# Legacy compatibility endpoints still instantiate this service. They remain environment-only
# until the legacy controller and its references can be retired in a later migration stage.
amadeus.client.id=${AMADEUS_CLIENT_ID:}
amadeus.client.secret=${AMADEUS_CLIENT_SECRET:}
amadeus.environment=sandbox

# Unsplash API
unsplash.access-key=${UNSPLASH_ACCESS_KEY:}
unsplash.app-name=jetsetter

# Cargar .env si existe (uso local)
spring.config.import=optional:file:.env[.properties]
